{% extends 'pages/portal_home.html' %}

{% block title %}
<title>Access Denied</title>
{% endblock title %}

{% block content_body %}
<div class="content-body">
    <div class="container-fluid">
        <div class="text-center py-5">
            <i class="fas fa-lock fa-3x text-danger mb-3"></i>
            <h3 class="fw-bold">Access Denied</h3>
            <p class="text-muted">{{ message|default:"You don't have permission to view this page." }}</p>
            <a href="{% url 'pages:portal-home' %}" class="btn btn-primary mt-2">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock content_body %}
