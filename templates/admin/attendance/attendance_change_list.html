{% extends 'admin/change_list.html' %}
{% load i18n %}

{% block object-tools %}
    <div class="module" style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; background: #f8f8f8;">
        <h3 style="margin-top: 0;">Bulk Reset Attendance</h3>
        <p class="help">Warning: This will delete all attendance records for the selected course within the date range.</p>
        
        <form id="reset-attd" action="{% url 'admin:reset_attd' %}" method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 10px;">
                <label style="display: inline-block; width: 100px;">Course:</label>
                <select name="course_id" class="vTextField" required>
                    <option value="">-- Select Course --</option>
                    {% for course in all_courses %}
                        <option value="{{ course.id }}">{{ course.course_code }} - {{ course.title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 10px;">
                <label style="display: inline-block; width: 100px;">Start Date:</label>
                <input type="date" name="startdate" class="vTextField" required>
            </div>

            <div style="margin-bottom: 10px;">
                <label style="display: inline-block; width: 100px;">End Date:</label>
                <input type="date" name="enddate" class="vTextField" required>
            </div>

            <button class="button" type="submit" style="background: #ba2121;" onclick="return confirm('Are you absolutely sure? This cannot be undone.')">
                Reset Course Attendance
            </button>
        </form>
    </div>

    {{ block.super }}
{% endblock object-tools %}
