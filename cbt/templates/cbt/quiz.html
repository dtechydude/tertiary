{% extends 'cbt/base.html' %}
{% load static %}

{% block title %}{{ obj.exam_name }}{% endblock %}

{% block content %}
<div class="container mt-3">
    <div class="row">
        <div class="col">
            <b>Exam: {{ obj.exam_name }} — {{ obj.course_name }}</b>
        </div>
        <div class="col text-end" id="timer-box"></div>
    </div>

    <form id="quiz-form" class="mt-4" data-quiz-id="{{ obj.pk }}">
        {% csrf_token %}
        <div id="quiz-box"></div>
        <button type="submit" class="btn btn-primary mt-3" id="submit-btn">Finish Exam</button>
    </form>

    <div id="result-box" class="mt-5 d-none">
        <h3 id="score-text"></h3>
        <div id="details-box"></div>
        <a href="{% url 'cbt:main-view' %}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'cbt/quiz.js' %}" defer></script>
{% endblock %}
