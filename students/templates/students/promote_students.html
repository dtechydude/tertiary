{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'pages/images/favicon.png'%} " />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #0A2647;
            --orange: #FF6700;
            --light-bg: #EAEAEA;
        }
        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            background-color: var(--dark-blue);
            padding: 1rem 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header .logo-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 15px;
        }
        .header .logo-container img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
        }
        .header .btn-outline-secondary {
            color: white;
            border-color: white;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .header .btn-outline-secondary:hover {
            background-color: var(--orange);
            color: white;
            border-color: var(--orange);
        }
        .container {
            max-width: 600px;
            margin-top: 3rem;
            margin-bottom: 3rem;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: var(--dark-blue);
            color: white;
            border-radius: 12px 12px 0 0;
        }
        .card-body h4, .card-body h5 {
            color: var(--dark-blue);
        }
        .btn-success {
            background-color: var(--orange);
            border-color: var(--orange);
            transition: background-color 0.2s;
        }
        .btn-success:hover {
            background-color: #e55e00;
            border-color: #e55e00;
        }
        .form-select, .form-control {
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="d-flex align-items-center">
        <a href="/dashboard/" class="logo-link d-flex align-items-center text-decoration-none">
            <div class="logo-container">
                <img src="{% static 'pages/images/kwikschool_logo.png' %}" alt="Kwikschool Logo">
            </div>
        </a>
    </div>
    <a href="/dashboard" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
    </a>
</header>
---
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header text-white">
            <h4 class="mb-0">Promote Students to Next Class</h4>
        </div>
        <div class="card-body">
            {% if messages %}
            {% for message in messages %}
            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="from_class" class="form-label fw-bold">Select Class to Promote</label>
                    <select class="form-select" id="from_class" name="from_class" required>
                        <option value="">-- Choose a class --</option>
                        {% for class in classes %}
                        <option value="{{ class.id }}">{{ class.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-success mt-3 w-100">
                    <i class="fas fa-arrow-up me-2"></i> Promote All Students
                </button>
            </form>
        </div>
    </div>
</div>
---
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
