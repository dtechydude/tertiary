{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student_full_name }} | Admission Letter</title>

       <!-- FAVICONS ICON -->	
    {% if school_info and school_info.logo %}
		<link rel="icon" href="{{ school_info.logo.url }}" type="image/png">
	{% else %}
		<link rel="icon" href="{% static 'pages/images/school_logo.jpg' %}" type="image/png">
	{% endif %}

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: "Segoe UI", sans-serif; padding-bottom: 60px; }

        .top-bar {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 14px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .letter-paper {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            padding: 50px 60px;
            max-width: 850px;
            margin: 0 auto;
        }

        .letterhead {
            display: flex;
            align-items: center;
            gap: 18px;
            border-bottom: 3px solid #002366;
            padding-bottom: 16px;
            margin-bottom: 28px;
        }
        .letterhead img.logo { width: 64px; height: 64px; object-fit: contain; }
        .letterhead h3 { color: #002366; font-weight: 800; margin-bottom: 2px; }
        .letterhead .school-meta { font-size: 0.8rem; color: #64748b; line-height: 1.4; }

        .letter-ref-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 24px;
        }

        .letter-title {
            text-align: center;
            text-decoration: underline;
            font-weight: 800;
            color: #002366;
            letter-spacing: 0.05em;
            margin: 24px 0;
        }

        .letter-body p { line-height: 1.8; color: #1e293b; text-align: justify; }

        .matric-highlight {
            background: #eaf2ff;
            border: 1px dashed #0d6efd;
            border-radius: 8px;
            padding: 10px 16px;
            display: inline-block;
            font-weight: 700;
            color: #0d6efd;
            margin: 10px 0;
        }

        .conditions-list li { margin-bottom: 8px; line-height: 1.6; }

        .signature-block { display: flex; justify-content: space-between; margin-top: 60px; gap: 40px; }
        .signature-column { text-align: center; flex: 1; }
        .signature-column img.signature-img { max-height: 60px; margin-bottom: 4px; }
        .signature-line { border-top: 1.5px solid #1e293b; padding-top: 6px; margin-top: 40px; }
        .signature-name { font-weight: 700; color: #1e293b; }
        .signature-title { font-size: 0.8rem; color: #64748b; }

        .qr-block { text-align: center; margin-top: 30px; }
        .qr-block small { display: block; color: #94a3b8; margin-top: 6px; }
        /* QRCode.js can render a <canvas>, an <img>, or (older-browser
           fallback) a <table> — the last of which is block-level and
           ignores an ancestor's text-align, which is why centering wasn't
           reliably working. Flexbox on the direct container centers
           whatever element the library actually inserts. */
        .qr-canvas {
            display: flex;
            justify-content: center;
        }
        .qr-canvas canvas, .qr-canvas img, .qr-canvas table {
            margin: 0 auto;
        }

        @page {
            size: A4;
            margin: 10mm 12mm;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: #fff; padding-bottom: 0; }
            .letter-paper {
                box-shadow: none !important;
                padding: 22px 34px;
                margin: 0;
                max-width: 100%;
            }

            /* Tightened spacing/line-height so a standard letter no longer
               spills a few lines onto a second, mostly-empty page. Screen
               view above is untouched — this only affects print/PDF. */
            .letterhead {
                margin-bottom: 16px;
                padding-bottom: 10px;
                page-break-inside: avoid;
            }
            .letterhead img.logo { width: 52px; height: 52px; }
            .letterhead h3 { font-size: 1.05rem; }
            .letterhead .school-meta { font-size: 0.72rem; }

            .letter-ref-row { margin-bottom: 16px; }

            .letter-title {
                margin: 14px 0;
                font-size: 1.05rem;
            }

            .letter-body p {
                line-height: 1.45;
                font-size: 0.92rem;
                margin-bottom: 0.55rem;
            }

            .matric-highlight {
                padding: 6px 12px;
                margin: 6px 0;
            }

            .conditions-list li {
                margin-bottom: 4px;
                line-height: 1.35;
                font-size: 0.88rem;
            }

            .signature-block {
                margin-top: 30px;
                page-break-inside: avoid;
            }
            .signature-column img.signature-img { max-height: 44px; }
            .signature-line { margin-top: 26px; padding-top: 4px; }

            .qr-block {
                margin-top: 14px;
                page-break-inside: avoid;
            }
            .qr-block canvas, .qr-block img, .qr-block table {
                width: 65px !important;
                height: 65px !important;
            }

            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    </style>
</head>
<body>

    <div class="top-bar no-print">
        <h5 class="fw-bold mb-0 text-dark">Admission Letter</h5>
        <div class="d-flex gap-2">
            {% if is_self_view %}
            <a href="{% url 'students:admission-letter-self-pdf' %}" class="btn btn-primary btn-sm shadow-sm">
                <i class="fas fa-file-pdf me-1"></i> Download PDF
            </a>
            {% else %}
            <a href="{% url 'students:admission-letter-pdf' student.matric_number %}" class="btn btn-primary btn-sm shadow-sm">
                <i class="fas fa-file-pdf me-1"></i> Download PDF
            </a>
            <a href="{% url 'students:verify-admission' student.matric_number %}" class="btn btn-outline-success btn-sm shadow-sm" target="_blank">
                <i class="fas fa-shield-halved me-1"></i> Verify
            </a>
            {% endif %}
            <button onclick="window.print()" class="btn btn-outline-primary btn-sm shadow-sm">
                <i class="fas fa-print me-1"></i> Print
            </button>
            <a href="/dashboard" class="btn btn-outline-secondary btn-sm shadow-sm">
                <i class="fas fa-chevron-left me-1"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="container-fluid">
        {% include 'students/_admission_letter_body.html' %}
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.querySelectorAll('.qr-canvas').forEach(function (el) {
            new QRCode(el, { text: el.dataset.verifyUrl, width: 80, height: 80 });
        });
    </script>
</body>
</html>
